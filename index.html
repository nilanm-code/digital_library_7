<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Library Gallery</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f2f5f3;
      line-height: 1.6;
    }

    header {
      background-color: #16423c;
      color: white;
      text-align: center;
      padding: 25px 20px;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 25px 20px;
    }

    /* CSS Grid: responsive columns, each at least 240px wide */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    /* Each image and caption sits in a card */
    .item {
      margin: 0;
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      overflow: hidden;
    }
    .item:hover {
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }

    /* Consistent size: every image is a 4:3 box, cropped to fit */
    .item img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }

    figcaption {
      padding: 12px 15px 15px;
    }
    figcaption strong {
      display: block;
    }
    figcaption span {
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Library Photo Gallery</h1>
    <p>A look around the spaces and collections of our library.</p>
  </header>

  <main>
    <section class="gallery">

      <figure class="item">
        <img src="images/reading-hall.jpg" alt="Students reading at desks in the main reading hall">
        <figcaption>
          <strong>Main reading hall</strong>
          <span>Silent seating for 300 readers.</span>
        </figcaption>
      </figure>

      <figure class="item">
        <img src="images/book-stacks.jpg" alt="Tall shelves filled with books">
        <figcaption>
          <strong>Book stacks</strong>
          <span>Open shelves organised by subject.</span>
        </figcaption>
      </figure>

      <figure class="item">
